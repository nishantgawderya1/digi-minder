<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#28745f" />
    <title>You're offline · Warrantly</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffaf0;
        color: #183a30;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0 0 24px;
        color: #52665d;
      }
      button {
        min-height: 48px;
        padding: 12px 24px;
        border: 0;
        border-radius: 14px;
        background: #28745f;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #e7a64b;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 24px;
        color: #52665d;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Warrantly" />
      <h1>Let's get you reconnected</h1>
      <p>
        Warrantly needs an internet connection to sign in, open your bills and
        save changes. Reconnect, then try again.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <small>Your private bills aren't stored in this offline page.</small>
    </main>
  </body>
</html>
